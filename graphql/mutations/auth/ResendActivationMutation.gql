mutation resendActivationMutation($email: String!, $turnstileToken: String!) {
  resendActivationEmail(email: $email, turnstileToken: $turnstileToken) {
    success
    errors {
      ... on NonFieldError {
        message
        code
      }
      ... on FieldError {
        message
        field
        code
      }
    }
  }
}
