mutation requestPasswordResetMutation(
  $email: String!
  $turnstileToken: String!
) {
  sendPasswordResetEmail(email: $email, turnstileToken: $turnstileToken) {
    success
    errors {
      ... on NonFieldError {
        message
        code
      }
      ... on FieldError {
        message
        field
        code
      }
    }
  }
}
