mutation loginMutation(
  $email: String!
  $password: String!
  $turnstileToken: String!
) {
  login(email: $email, password: $password, turnstileToken: $turnstileToken) {
    success
    token
    refreshToken
    user {
      verified
    }
    errors {
      ... on NonFieldError {
        message
        code
      }
      ... on FieldError {
        message
        field
        code
      }
    }
  }
}
