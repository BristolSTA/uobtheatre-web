fragment ProductionsDetailsFragment on ProductionNodeConnection {
  edges {
    node {
      id
      slug
      name
      start
      end
      isBookable
      society {
        name
      }
      featuredImage {
        id
        url
      }
      coverImage {
        id
        url
      }
      venues {
        id
        name
      }
      performances(runOn: $nowDate) {
        edges {
          node {
            id
            doorsOpen
            start
            soldOut
            end
            venue {
              id
              name
            }
            production {
              id
              name
              featuredImage {
                url
              }
            }
          }
        }
      }
    }
  }
}
